headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "/Users/cc3po/.openclaw/workspace/centralvalleylocals"
publishOrigin = "config"

[build.environment]

[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
